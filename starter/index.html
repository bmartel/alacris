<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alacris UI — design system starter</title>
  <!--
    Inside this repo the import map points at the local build (run `npm run build`
    at the repo root first, or `npm run demo` which serves this page at
    http://localhost:5173/starter/).

    In your own project, point it at a pinned CDN build instead:
      "alacris": "https://cdn.jsdelivr.net/npm/alacris@0.6/dist/alacris.js"
  -->
  <script type="importmap">
  {
    "imports": {
      "alacris": "../dist/alacris.js",
      "alacris/store": "../dist/store.js",
      "alacris/context": "../dist/context.js"
    }
  }
  </script>
  <style>
    /* Document chrome only — the demo app and every component theme themselves. */
    html { height: 100%; scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
    body {
      margin: 0;
      min-height: 100%;
      background: var(--ui-color-surface);
      color: var(--ui-color-on-surface);
      font: var(--ui-type-body-md);
      letter-spacing: var(--ui-type-body-md-tracking);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./demo/main.js"></script>
</body>
</html>
