name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths: ['docs/**', 'src/**', 'ui/**', '.github/workflows/docs.yml']
  # semantic-release pushes its version bump as `chore(release): x.y.z [skip
  # ci]`, and GitHub honours that marker by not running push workflows for it.
  # Without this trigger the site would keep serving the tree from *before* the
  # bump, so the playground would install the previous release and the pinned
  # examples would show the previous version. The release event is not subject
  # to [skip ci], and by the time it fires the bump commit is on main.
  release:
    types: [published]
  workflow_dispatch:

# Never deploy two builds at once, but let a newer commit supersede an
# in-flight one — the site should end up matching main.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      # The docs run the real library: every example on the site imports the
      # built bundle, so the library has to be built before the site is.
      - name: Build the library
        run: |
          npm ci
          npm run build

      - name: Build the docs
        working-directory: docs
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to Pages
      id-token: write # verify the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
