name: Release UI

on:
  push:
    branches: [main]
    paths:
      - 'starter/**'
      - '.github/workflows/release-ui.yml'
      - 'scripts/release-filter-scopes.js'
  workflow_dispatch:

# Independent of the library release. The two must never share a concurrency
# group — a UI publish waiting on an Alacris publish (or the reverse) is the
# coupling this workflow exists to avoid.
concurrency:
  group: release-ui
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test:ui

      # semantic-release's first tag is 1.0.0. Seed a 0.0.0 so the first
      # feat(ui) lands at 0.1.0, matching starter/package.json. Local-only:
      # the git plugin pushes ui-v* tags from here on.
      - name: Seed ui-v0.0.0 if this is the first UI release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git tag -l 'ui-v*' | grep -q .; then
            echo 'UI tags already exist'
            exit 0
          fi
          seed=$(git rev-parse HEAD^)
          git tag ui-v0.0.0 "$seed"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref=refs/tags/ui-v0.0.0 \
            -f sha="$seed"

      - name: Release
        working-directory: starter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ../node_modules/semantic-release/bin/semantic-release.js
