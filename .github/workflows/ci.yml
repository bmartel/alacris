name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Pull requests are squash-merged, so the PR title becomes the commit message
  # that semantic-release reads to decide the next version. A title it cannot
  # parse means a release that silently does not happen.
  pr-title:
    name: PR title is a conventional commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|revert|docs|test|build|ci|chore)(\([a-z0-9._-]+\))?!?: .+'
          if printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title is not a conventional commit: '$TITLE'"
            echo "Expected '<type>(<scope>): <summary>', for example:"
            echo "  fix(html): keep focus when a keyed row moves"
            echo "  feat(store)!: selector() takes a comparator"
            echo "  feat(ui): add a combobox"
            echo "Types: feat fix perf refactor revert docs test build ci chore"
            echo "Scope ui (or starter) publishes @alacris/ui, not @alacris/core."
            echo "See CONTRIBUTING.md for which types trigger a release."
            exit 1
          fi

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui

  build:
    name: build, types and size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck

      # The published size is part of the contract. If a change moves it, the
      # regenerated SIZE.md has to be committed alongside. The check is exact
      # on raw and gzip, with a few bytes of tolerance on brotli — that
      # encoder ships with Node, and its patch releases move the output.
      - name: SIZE.md is current
        run: node scripts/size.js --check

      - name: Report size
        run: cat SIZE.md >> "$GITHUB_STEP_SUMMARY"

      # Pinned versions and quoted size figures are derived from package.json
      # and SIZE.md, and rewritten by the release. A pull request must not
      # hand-edit one to something that is about to be overwritten, or add a
      # new one that is already stale. Runs after SIZE.md is regenerated above,
      # because the size figures are read from it.
      - name: Versions and sizes in the docs are current
        run: npm run sync-docs -- --check

  isolate:
    name: library source and UI source are not mixed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: git fetch origin ${{ github.base_ref }}
      - run: node scripts/check-pr-scope.mjs
