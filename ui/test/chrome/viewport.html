<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overlay viewport check</title>
  <script type="importmap">
  { "imports": { "@alacris/core": "/src/index.js" } }
  </script>
  <style>body { margin: 0; font: 16px system-ui; } .tall { block-size: 3000px; }</style>
</head>
<body>
  <div class="tall">page content taller than the screen</div>
  <script type="module">
    // Driven by run.mjs over CDP with a small emulated mobile viewport. Each
    // check opens one overlay with more content than fits, and asserts that
    // what must be tappable (actions, footer, focused field) is inside the
    // visible area. `kb(px)` fakes an on-screen keyboard by swapping in a
    // visualViewport that is `px` shorter than the layout viewport — what
    // Chrome reports with the default interactive-widget=resizes-visual.
    import { applyTheme, createTheme } from '/ui/src/theme/index.js';
    import '/ui/src/components/ui-dialog.js';
    import '/ui/src/components/ui-drawer.js';
    import '/ui/src/components/ui-sheet.js';
    import '/ui/src/components/ui-side-sheet.js';
    import '/ui/src/components/ui-date-picker.js';
    import '/ui/src/components/ui-menu.js';
    import '/ui/src/components/ui-menu-item.js';
    import '/ui/src/components/ui-snackbar.js';
    import '/ui/src/components/ui-button.js';
    import '/ui/src/components/ui-tabs.js';
    import '/ui/src/components/ui-card.js';
    import '/ui/src/components/ui-select.js';
    import '/ui/src/components/ui-option.js';

    applyTheme(createTheme());

    let keyboard = 0;
    const real = window.visualViewport;
    class FakeVV extends EventTarget {
      get scale() { return 1; }
      get offsetTop() { return 0; }
      get offsetLeft() { return 0; }
      get width() { return document.documentElement.clientWidth; }
      get height() { return document.documentElement.clientHeight - keyboard; }
    }
    const fake = new FakeVV();
    Object.defineProperty(window, 'visualViewport', { configurable: true, get: () => fake });
    // A keyboard never takes more than about half the screen.
    const kb = (px) => {
      keyboard = Math.min(px, Math.round(document.documentElement.clientHeight * 0.5));
      fake.dispatchEvent(new Event('resize'));
    };

    const frames = (n = 2) => new Promise((r) => {
      const step = () => (--n <= 0 ? r() : requestAnimationFrame(step));
      requestAnimationFrame(step);
    });
    const wait = (el, type) => new Promise((r) => el.addEventListener(type, r, { once: true }));
    const visibleBottom = () => document.documentElement.clientHeight - keyboard;
    const lines = (n, tag = 'p') => Array.from({ length: n }, (_, i) => `<${tag}>Line ${i + 1}</${tag.split(' ')[0]}>`).join('');

    const results = [];
    const check = (name, ok, info) => results.push({ name, ok: !!ok, info });
    const inView = (name, el, slack = 0.5) => {
      const r = el.getBoundingClientRect();
      check(name, r.height > 0 && r.top >= -slack && r.bottom <= visibleBottom() + slack,
        { top: Math.round(r.top), bottom: Math.round(r.bottom), visibleBottom: visibleBottom() });
    };
    const mount = (markup) => {
      const d = document.createElement('div');
      d.innerHTML = markup;
      document.body.append(d);
      return d.firstElementChild;
    };
    const close = async (el, prop = 'open') => {
      const done = wait(el, 'closed');
      el[prop] = false;
      await Promise.race([done, new Promise((r) => setTimeout(r, 1000))]);
      el.parentElement.remove();
    };

    async function dialog() {
      const el = mount(`<ui-dialog label="Edit">
        <span slot="headline">Edit item</span>
        ${lines(40)}
        <ui-button slot="actions" variant="text">Cancel</ui-button>
        <ui-button slot="actions">Save</ui-button>
      </ui-dialog>`);
      const opened = wait(el, 'opened');
      el.open = true;
      await opened;
      const sr = el.shadowRoot;
      const overlay = sr.querySelector('.overlay');
      const o = overlay.getBoundingClientRect();
      check('dialog: overlay fills the visible viewport exactly', Math.abs(o.height - visibleBottom()) < 1 && o.top === 0,
        { height: o.height, innerHeight, block: getComputedStyle(overlay).blockSize });
      inView('dialog: surface on screen', sr.querySelector('.surface'));
      inView('dialog: actions on screen', sr.querySelector('.actions'));
      inView('dialog: Save button on screen', el.querySelector('ui-button:last-of-type'));
      const body = sr.querySelector('.body');
      check('dialog: body scrolls', body.scrollHeight > body.clientHeight + 10,
        { scrollHeight: body.scrollHeight, clientHeight: body.clientHeight });
      await close(el);
    }

    async function dialogKeyboard() {
      const el = mount(`<ui-dialog label="Edit">
        <span slot="headline">Edit item</span>
        ${lines(12)}
        <label>Name <input id="name" style="display:block;inline-size:100%"></label>
        <ui-button slot="actions" variant="text">Cancel</ui-button>
        <ui-button slot="actions">Save</ui-button>
      </ui-dialog>`);
      const opened = wait(el, 'opened');
      el.open = true;
      await opened;
      const input = el.querySelector('#name');
      input.focus();
      kb(260);
      await frames(4);
      const sr = el.shadowRoot;
      inView('dialog+keyboard: surface above keyboard', sr.querySelector('.surface'));
      inView('dialog+keyboard: actions above keyboard', sr.querySelector('.actions'));
      inView('dialog+keyboard: focused field above keyboard', input);
      kb(0);
      await frames(2);
      const o = sr.querySelector('.overlay');
      check('dialog: keyboard inset cleared after keyboard hides', !o.style.getPropertyValue('--ui-vv-bottom'),
        { style: o.getAttribute('style') });
      await close(el);
    }

    async function drawer() {
      const el = mount(`<ui-drawer label="Nav">
        ${lines(60, 'a href="#" style="display:block"')}
        <a slot="footer" id="settings" href="#">Settings</a>
      </ui-drawer>`);
      const opened = wait(el, 'opened');
      el.open = true;
      await opened;
      const sr = el.shadowRoot;
      inView('drawer: surface fits the visible viewport', sr.querySelector('.surface'));
      inView('drawer: footer item on screen', el.querySelector('#settings'));
      const content = sr.querySelector('.content');
      check('drawer: content scrolls', content.scrollHeight > content.clientHeight + 10,
        { scrollHeight: content.scrollHeight, clientHeight: content.clientHeight });
      kb(200);
      await frames(3);
      inView('drawer+keyboard: footer above keyboard', el.querySelector('#settings'));
      kb(0);
      await close(el);
    }

    async function drawerNoFooter() {
      // Drawers without a footer slot: the last item must still be reachable
      // by scrolling the content to its end.
      const el = mount(`<ui-drawer label="Nav">${lines(60, 'a href="#" style="display:block"')}<a id="last" href="#">Last</a></ui-drawer>`);
      const opened = wait(el, 'opened');
      el.open = true;
      await opened;
      const content = el.shadowRoot.querySelector('.content');
      content.scrollTop = content.scrollHeight;
      await frames(2);
      inView('drawer: last item reachable by scrolling', el.querySelector('#last'));
      await close(el);
    }

    async function sheet() {
      const el = mount(`<ui-sheet label="Sheet">
        <span slot="headline">Options</span>
        ${lines(40)}
        <ui-button slot="actions" id="done">Done</ui-button>
      </ui-sheet>`);
      const opened = wait(el, 'opened');
      el.open = true;
      await opened;
      inView('bottom sheet: surface on screen', el.shadowRoot.querySelector('.surface'));
      inView('bottom sheet: actions on screen', el.querySelector('#done'));
      kb(220);
      await frames(3);
      inView('bottom sheet+keyboard: actions above keyboard', el.querySelector('#done'));
      kb(0);
      await close(el);
    }

    async function sideSheet() {
      const el = mount(`<ui-side-sheet label="Filters">
        <span slot="headline">Filters</span>
        ${lines(40)}
        <ui-button slot="actions" id="apply">Apply</ui-button>
      </ui-side-sheet>`);
      const opened = wait(el, 'opened');
      el.open = true;
      await opened;
      inView('side sheet: surface fits', el.shadowRoot.querySelector('.surface'));
      inView('side sheet: actions on screen', el.querySelector('#apply'));
      await close(el);
    }

    async function datePicker() {
      const el = mount('<ui-date-picker label="Due" presentation="modal" value="2026-03-14"></ui-date-picker>');
      await frames(2);
      const btn = el.shadowRoot.querySelector('ui-icon-button');
      const opened = wait(el, 'open');
      (btn.shadowRoot?.querySelector('button') || btn).click();
      await opened;
      const sr = el.shadowRoot;
      inView('date picker (modal): surface fits', sr.querySelector('.modal-surface'));
      inView('date picker (modal): OK/Cancel on screen', sr.querySelector('.modal-surface .actions'));
      const closed = wait(el, 'close');
      sr.querySelector('.modal-surface .actions ui-button').click();
      await Promise.race([closed, new Promise((r) => setTimeout(r, 1000))]);
      el.remove();
    }

    async function datePickerDocked() {
      // Low on the screen, inside a scroller that clips and a transformed
      // ancestor: the calendar is in the top layer, above the field, whole.
      const box = mount(`<div style="position:fixed;left:16px;top:${visibleBottom() - 120}px;inline-size:300px;block-size:100px;overflow:hidden;transform:translateZ(0)">
        <ui-date-picker label="Due" value="2026-03-14" style="margin-top:20px"></ui-date-picker>
      </div>`);
      const el = box.querySelector('ui-date-picker');
      await frames(2);
      const opened = wait(el, 'open');
      const input = el.shadowRoot.querySelector('input');
      input.focus();
      input.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', altKey: true, bubbles: true, composed: true, cancelable: true }));
      await Promise.race([opened, new Promise((r) => setTimeout(r, 1000))]);
      await frames(2);
      const panel = el.shadowRoot.querySelector('.panel');
      check('date picker (docked): panel in the top layer', panel.matches(':popover-open'));
      inView('date picker (docked): panel fits', panel);
      const field = el.shadowRoot.querySelector('.field').getBoundingClientRect();
      check('date picker (docked): flips above the field', panel.getBoundingClientRect().bottom <= field.top + 0.5,
        { panelBottom: Math.round(panel.getBoundingClientRect().bottom), fieldTop: Math.round(field.top) });
      const day = panel.querySelector('[data-iso="2026-03-14"]');
      check('date picker (docked): keyboard focus on the selected day', el.shadowRoot.activeElement === day);
      const r = day.getBoundingClientRect();
      const hit = el.shadowRoot.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
      check('date picker (docked): day is not covered or clipped', hit === day || day.contains(hit));
      day.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, composed: true, cancelable: true }));
      await frames(3);
      check('date picker (docked): Escape returns focus to the field', el.shadowRoot.activeElement === input);
      box.remove();
    }

    async function menu() {
      // An anchor low on the screen with the keyboard up: the panel must open
      // above it (flip), not under the keyboard.
      const el = mount(`<ui-menu style="position:fixed;left:16px;top:${visibleBottom() - 300}px">
        <button slot="anchor">More</button>
        ${Array.from({ length: 6 }, (_, i) => `<ui-menu-item value="${i}">Item ${i}</ui-menu-item>`).join('')}
      </ui-menu>`);
      kb(260);
      await frames(2);
      const opened = wait(el, 'open');
      el.open = true;
      await Promise.race([opened, new Promise((r) => setTimeout(r, 1000))]);
      await frames(2);
      inView('menu+keyboard: panel above keyboard', el.shadowRoot.querySelector('.panel'));
      kb(0);
      el.open = false;
      await frames(2);
      el.parentElement.remove();
    }

    async function snackbar() {
      const el = mount('<ui-snackbar message="Saved" action="Undo" duration="0"></ui-snackbar>');
      const opened = wait(el, 'opened');
      el.open = true;
      await opened;
      inView('snackbar: on screen', el.shadowRoot.querySelector('.surface'));
      kb(240);
      await frames(3);
      inView('snackbar+keyboard: above keyboard', el.shadowRoot.querySelector('.surface'));
      kb(0);
      await close(el);
    }

    async function tabsOverflow() {
      // More tabs than fit: the bar scrolls, the page does not widen, and the
      // indicator stays under the selected tab wherever the bar is scrolled.
      const names = ['Overview', 'Files', 'Inbox', 'Activity', 'Account', 'Settings', 'Billing', 'Integrations'];
      const box = mount(`<div style="position:fixed;inset-block-start:8px;inset-inline-start:8px;inline-size:300px">
        <ui-tabs value="Overview" label="Sections">
          ${names.map((n) => `<ui-tab value="${n}">${n}</ui-tab>`).join('')}
          ${names.map((n) => `<ui-tab-panel slot="panels" value="${n}">${n}</ui-tab-panel>`).join('')}
        </ui-tabs></div>`);
      const tabs = box.querySelector('ui-tabs');
      const list = tabs.shadowRoot.querySelector('.tablist');
      const indicator = tabs.shadowRoot.querySelector('.indicator');
      const settle = () => new Promise((r) => setTimeout(r, 600)); // indicator transition
      const aligned = (name, value) => {
        const inner = tabs.querySelector(`ui-tab[value="${value}"]`).shadowRoot.querySelector('.inner');
        const a = inner.getBoundingClientRect();
        const b = indicator.getBoundingClientRect();
        check(name, a.width > 8 && Math.abs(a.left - b.left) < 1 && Math.abs(a.width - b.width) < 1,
          { tab: [Math.round(a.left), Math.round(a.width)], indicator: [Math.round(b.left), Math.round(b.width)] });
      };
      await frames(3);
      await settle();
      check('tabs: bar scrolls instead of widening', list.scrollWidth > list.clientWidth + 10 && box.scrollWidth <= box.clientWidth,
        { scrollWidth: list.scrollWidth, clientWidth: list.clientWidth, box: box.scrollWidth });
      aligned('tabs: indicator spans the first tab on first paint', 'Overview');

      const pageScroll = scrollY;
      tabs.querySelector('ui-tab[value="Integrations"]').click();
      await frames(3);
      await settle();
      const l = list.getBoundingClientRect();
      const last = tabs.querySelector('ui-tab[value="Integrations"]').getBoundingClientRect();
      check('tabs: selected tab is scrolled fully into the bar', last.left >= l.left - 0.5 && last.right <= l.right + 0.5,
        { tab: [Math.round(last.left), Math.round(last.right)], bar: [Math.round(l.left), Math.round(l.right)] });
      check('tabs: selecting did not scroll the page', scrollY === pageScroll, { before: pageScroll, after: scrollY });
      aligned('tabs: indicator under the selected tab after scrolling to it', 'Integrations');

      list.scrollLeft = 0;
      await frames(3);
      aligned('tabs: indicator travels with its tab when the bar is scrolled', 'Integrations');

      const label = tabs.querySelector('ui-tab[value="Integrations"]');
      label.textContent = 'Integrations (12)';
      list.scrollLeft = list.scrollWidth;
      await frames(3);
      await settle();
      aligned('tabs: indicator re-measures when the label changes size', 'Integrations');
      box.remove();
    }

    async function selectInCard() {
      // A select inside a card (overflow: hidden + its own stacking context)
      // followed by another card: the option panel must be neither clipped by
      // its card nor painted under the next one.
      const box = mount(`<div style="position:fixed;inset-block-start:8px;inset-inline-start:8px;inline-size:300px;display:grid;gap:8px">
        <ui-card><ui-select label="Plan" value="a">
          <ui-option value="a">Individual</ui-option>
          <ui-option value="b">Pro</ui-option>
          <ui-option value="c">Pro+</ui-option>
        </ui-select></ui-card>
        <ui-card><div style="block-size:240px">The next card</div></ui-card></div>`);
      const select = box.querySelector('ui-select');
      await frames(2);
      const opened = wait(select, 'open');
      select.shadowRoot.querySelector('[part="control"]').click();
      await Promise.race([opened, new Promise((r) => setTimeout(r, 1000))]);
      await frames(2);
      const panel = select.shadowRoot.querySelector('.panel');
      check('select in card: panel is in the top layer', panel?.matches(':popover-open'));
      for (const opt of select.querySelectorAll('ui-option')) {
        const r = opt.getBoundingClientRect();
        const hit = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
        check(`select in card: "${opt.textContent.trim()}" is not clipped or covered`,
          r.height > 0 && (hit === opt || opt.contains(hit)) && r.bottom <= visibleBottom() + 0.5,
          { top: Math.round(r.top), bottom: Math.round(r.bottom), hit: hit?.localName });
      }
      const field = select.getBoundingClientRect();
      const p = panel.getBoundingClientRect();
      check('select in card: panel is anchored to its field', Math.abs(p.left - field.left) < 2 && p.top >= field.bottom - 1,
        { panel: [Math.round(p.left), Math.round(p.top)], field: [Math.round(field.left), Math.round(field.bottom)] });
      box.remove();
    }

    window.runChecks = async () => {
      for (const fn of [dialog, dialogKeyboard, drawer, drawerNoFooter, sheet, sideSheet, datePicker, datePickerDocked, menu, snackbar, tabsOverflow, selectInCard]) {
        try { await fn(); } catch (e) { check(`${fn.name}: threw`, false, String(e?.stack || e)); }
        kb(0);
      }
      return { viewport: { innerWidth, innerHeight, realVV: real && { h: real.height, w: real.width } }, results };
    };
    window.ready = true;
  </script>
</body>
</html>
