<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alacris — demo</title>
<style>
  :root { color-scheme: light dark; --bg:#fbfbfd; --fg:#16161a; --mut:#6b6b76; --line:#e3e3ea; --acc:#ffb300; --card:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101013; --fg:#eeeef2; --mut:#9a9aa6; --line:#2a2a32; --acc:#ffc233; --card:#18181d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:2.5rem 1.25rem 5rem; background:var(--bg); color:var(--fg);
         font:16px/1.6 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width: 46rem; margin: 0 auto; }
  h1 { font-size:2.6rem; margin:0 0 .2rem; letter-spacing:-.03em; }
  h1 span { color: var(--acc); }
  .tag { color:var(--mut); margin:0 0 2.5rem; }
  section { border:1px solid var(--line); border-radius:14px; padding:1.25rem 1.4rem 1.5rem;
            margin-bottom:1.25rem; background:var(--card); }
  h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.09em; color:var(--mut);
       margin:0 0 1rem; font-weight:600; }
  pre { background:color-mix(in srgb, var(--fg) 5%, transparent); padding:.9rem 1rem; border-radius:9px;
        overflow-x:auto; font-size:.82rem; line-height:1.55; margin:1rem 0 0; }
  code { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; }
  footer { color:var(--mut); font-size:.85rem; text-align:center; margin-top:2rem; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Jo<span>l</span>t</h1>
  <p class="tag">Signals + fine-grained DOM. Every widget below is a real custom element.</p>

  <section>
    <h2>Counter &mdash; props, computed, events</h2>
    <ala-counter start="3"></ala-counter>
    <pre><code>&lt;ala-counter start="3"&gt;&lt;/ala-counter&gt;</code></pre>
  </section>

  <section>
    <h2>Todos &mdash; keyed lists, two-way input</h2>
    <ala-todos></ala-todos>
  </section>

  <section>
    <h2>Interop &mdash; driven from plain JavaScript</h2>
    <ala-counter id="remote" start="100"></ala-counter>
    <p style="margin:1rem 0 0">
      <button id="poke">document.getElementById('remote').start += 10</button>
    </p>
  </section>

  <section>
    <h2>Stress &mdash; 1,000 keyed rows</h2>
    <ala-bench></ala-bench>
  </section>

  <footer>
    <a href="https://unpkg.com/alacris">unpkg.com/alacris</a> &middot;
    <a href="./test.html">browser test suite</a>
  </footer>
</main>

<script type="module">
// In your own page this line is:
//   import { define, html, css, signal, computed, keyed } from 'https://unpkg.com/alacris';
import { define, html, css, signal, computed, effect, keyed, batch } from '../dist/alacris.js';

const base = css`
  :host { display:block; font:inherit; color:inherit; }
  button { font:inherit; padding:.45rem .85rem; border-radius:8px; cursor:pointer;
           border:1px solid var(--line,#ddd); background:transparent; color:inherit; }
  button:hover { border-color: var(--acc,#ffb300); }
`;

/* ------------------------------------------------------------------ counter */
define('ala-counter', {
  props: { start: 0, step: 1 },
  styles: base + css`
    .row { display:flex; align-items:center; gap:.75rem; }
    output { font-variant-numeric: tabular-nums; font-size:1.6rem; min-width:3.5ch; }
    .note { color:var(--mut,#888); font-size:.85rem; }
  `,
  setup({ start, step }, host) {
    const n = signal(start());
    const doubled = computed(() => n() * 2);

    // Follow the `start` prop whenever it changes from the outside world.
    effect(() => n(start()));

    return html`
      <div class="row">
        <button @click=${() => n(n() - step())}>−</button>
        <output>${n}</output>
        <button @click=${() => n(n() + step())}>+</button>
        <button @click=${() => { n(start()); host.emit('reset', { to: start() }); }}>reset</button>
        <span class="note">doubled: ${doubled}</span>
      </div>`;
  },
});

/* -------------------------------------------------------------------- todos */
let uid = 0;
define('ala-todos', {
  styles: base + css`
    form { display:flex; gap:.5rem; margin-bottom:1rem; }
    input[type=text] { flex:1; font:inherit; padding:.45rem .7rem; border-radius:8px;
                       border:1px solid var(--line,#ddd); background:transparent; color:inherit; }
    ul { list-style:none; margin:0; padding:0; }
    li { display:flex; align-items:center; gap:.6rem; padding:.35rem 0;
         border-bottom:1px solid var(--line,#eee); }
    li:last-child { border-bottom:0; }
    .txt { flex:1; }
    .done .txt { text-decoration:line-through; opacity:.45; }
    .x { border:0; background:none; color:var(--mut,#888); cursor:pointer; font-size:1.1rem; padding:0 .3rem; }
    .bar { display:flex; justify-content:space-between; color:var(--mut,#888);
           font-size:.85rem; margin-top:.9rem; }
  `,
  setup() {
    const items = signal([
      { id: ++uid, text: 'Read the 3.7 KB source', done: true },
      { id: ++uid, text: 'Drop it into any framework', done: false },
      { id: ++uid, text: 'Ship it', done: false },
    ]);
    const draft = signal('');
    const left = computed(() => items().filter(t => !t.done).length);

    const add = e => {
      e.preventDefault();
      const text = draft().trim();
      if (!text) return;
      batch(() => {
        items([...items(), { id: ++uid, text, done: false }]);
        draft('');
      });
    };
    const toggle = id => items(items().map(t => t.id === id ? { ...t, done: !t.done } : t));
    const remove = id => items(items().filter(t => t.id !== id));

    return html`
      <form @submit=${add}>
        <input type="text" placeholder="What needs doing?"
               .value=${draft} @input=${e => draft(e.target.value)}>
        <button type="submit">add</button>
      </form>
      <ul>
        ${() => items().map(t => keyed(t.id, html`
          <li class=${t.done ? 'done' : ''}>
            <input type="checkbox" .checked=${t.done} @change=${() => toggle(t.id)}>
            <span class="txt">${t.text}</span>
            <button class="x" title="remove" @click=${() => remove(t.id)}>×</button>
          </li>`))}
      </ul>
      <div class="bar">
        <span>${left} left</span>
        <span>${() => items().length} total</span>
      </div>`;
  },
});

/* --------------------------------------------------------------- benchmark */
const words = ['bright', 'quiet', 'amber', 'brisk', 'hollow', 'iron', 'lucid', 'nimble', 'raw', 'swift'];
const make = n => Array.from({ length: n }, (_, i) => ({
  id: i + 1,
  label: `${words[i % words.length]} ${i + 1}`,
}));

define('ala-bench', {
  styles: base + css`
    .ctl { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin-bottom:.9rem; }
    .ms { color:var(--mut,#888); font-size:.85rem; font-variant-numeric:tabular-nums; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr)); gap:.15rem .8rem;
            max-height:14rem; overflow:auto; font-size:.8rem;
            border-top:1px solid var(--line,#eee); padding-top:.7rem; }
    .hit { color: var(--acc,#ffb300); }
  `,
  setup() {
    const rows = signal(make(1000));
    const ms = signal('');
    const time = (name, fn) => {
      const t0 = performance.now();
      fn();
      ms(`${name}: ${(performance.now() - t0).toFixed(1)} ms`);
    };

    return html`
      <div class="ctl">
        <button @click=${() => time('create 1k', () => rows(make(1000)))}>create 1k</button>
        <button @click=${() => time('update every 10th', () =>
          rows(rows().map((r, i) => i % 10 ? r : { ...r, label: r.label + ' !!!' })))}>update every 10th</button>
        <button @click=${() => time('swap rows', () => {
          const next = rows().slice();
          if (next.length > 998) { const t = next[1]; next[1] = next[998]; next[998] = t; }
          rows(next);
        })}>swap</button>
        <button @click=${() => time('reverse', () => rows(rows().slice().reverse()))}>reverse</button>
        <button @click=${() => time('clear', () => rows([]))}>clear</button>
        <span class="ms">${ms}</span>
      </div>
      <div class="grid">
        ${() => rows().map(r => keyed(r.id, html`<div class=${r.label.endsWith('!!!') ? 'hit' : ''}>${r.label}</div>`))}
      </div>`;
  },
});

/* ----------------------------------------------------------------- interop */
// An Alacris element is just a DOM element: set properties, listen for events.
document.getElementById('poke').addEventListener('click', () => {
  document.getElementById('remote').start += 10;
});
document.getElementById('remote').addEventListener('reset', e => {
  console.log('reset to', e.detail.to);
});
</script>
</body>
</html>
